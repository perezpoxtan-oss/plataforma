name: Actualizar composer.lock

# El entorno de desarrollo de Claude no puede descargar paquetes de Composer.
# Este flujo genera composer.lock en GitHub y lo sube a la rama.
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: [composer.json]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          # Version MAS BAJA en uso: asi composer.lock solo elige librerias que corren en
          # 8.4 y en 8.5 (la CI prueba ambas). Ver docs/tecnico/despliegue.md.
          php-version: '8.4'
          coverage: none
      - name: composer update
        run: composer update --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Subir composer.lock si cambio
        run: |
          if [ -n "$(git status --porcelain composer.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composer.lock
            git commit -m "Actualiza composer.lock"
            git push
          else
            echo "composer.lock sin cambios"
          fi
