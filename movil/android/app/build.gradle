apply plugin: 'com.android.application'

// Datos de la app en UN solo lugar: movil/app.config.json (appId y nombre).
// El appId (applicationId) es permanente una vez publicada la app en Google Play.
def appConfig = new groovy.json.JsonSlurper().parse(rootProject.file('../app.config.json'))

// Dirección del servidor para las etiquetas NFC con la app cerrada (AndroidManifest: servidorHost, servidorRutaEtiquetas).
// Sale de server.url, el MISMO valor que usa la app: «npx cap sync android» lo escribe en
// src/main/assets/capacitor.config.json (calculado por capacitor.config.js desde app.config.json).
// Sin ese archivo (falta el «sync») la app compila igual, pero las etiquetas con la app cerrada abren el navegador.
def servidorHost = 'sin-configurar.invalid'
def servidorRutaEtiquetas = '/e/'
def capConfigArchivo = file('src/main/assets/capacitor.config.json')
if (capConfigArchivo.exists()) {
    def capConfig = new groovy.json.JsonSlurper().parse(capConfigArchivo)
    def servidorUrl = capConfig?.server?.url
    if (servidorUrl) {
        def servidorUri = new URI(servidorUrl.toString())
        if (servidorUri.host) {
            servidorHost = servidorUri.host
            servidorRutaEtiquetas = (servidorUri.path ?: '').replaceAll('/+$', '') + '/e/'
        }
    }
} else {
    logger.warn('Falta src/main/assets/capacitor.config.json: ejecuta «npx cap sync android» en la carpeta movil.')
}

// Versión: la CI la escribe en cada compilación (.github/workflows/apk.yml) con
// -PcodigoVersion=<número que siempre crece> -PnombreVersion=<v1.2.3 o qa-abc1234>.
// En Android Studio, sin esos datos, queda 1 / "1.0" como siempre.
def codigoVersion = (project.findProperty('codigoVersion') ?: '1').toString().toInteger()
def nombreVersion = (project.findProperty('nombreVersion') ?: '1.0').toString()

// Firma de publicación (docs/tecnico/app-movil.md, «Compilación automática»): solo si
// existen las variables de entorno; la CI las toma de los secretos del repositorio.
// La llave NUNCA va en el repositorio. Sin ellas, la versión release queda sin firmar.
def firmaArchivo = System.getenv('ANDROID_KEYSTORE_FILE')
def conFirma = firmaArchivo && file(firmaArchivo).exists()

android {
    namespace = "mx.smartcentinel.app"
    signingConfigs {
        if (conFirma) {
            publicacion {
                storeFile file(firmaArchivo)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        resValues = true
    }
    defaultConfig {
        applicationId appConfig.appId
        resValue "string", "app_name", appConfig.appName
        resValue "string", "title_activity_main", appConfig.appName
        manifestPlaceholders = [servidorHost: servidorHost, servidorRutaEtiquetas: servidorRutaEtiquetas]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode codigoVersion
        versionName nombreVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (conFirma) {
                signingConfig = signingConfigs.publicacion
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
